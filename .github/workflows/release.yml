name: Release

# Supply-chain policy (docs/PLAN.md D11; test/supply-chain.test.js enforces it):
#  - the only action is GitHub's own checkout, pinned to a commit; the release itself is made with the
#    gh CLI that ships on the runner, so no third-party action ever sees the repository token;
#  - nothing is installed from npm here: the module is plain files, zipped as they are in the repository.

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Pinned to a commit, not to a tag that can be moved. Bump the hash and the comment together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The tag name is outside input: it reaches the shell through the environment, never through
      # ${{ }} inside a script, and only a plain version number gets any further.
      - name: Derive version from tag
        id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Matched against the whole string (grep would accept any one matching line).
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp module.json
        env:
          V: ${{ steps.v.outputs.version }}
          OWNER_REPO: ${{ github.repository }}
        run: |
          jq --arg v "$V" --arg or "$OWNER_REPO" '
            .version = $v
            | .url = "https://github.com/" + $or
            | .manifest = "https://github.com/" + $or + "/releases/latest/download/module.json"
            | .download = "https://github.com/" + $or + "/releases/download/v" + $v + "/module.zip"
          ' module.json > module.json.tmp && mv module.json.tmp module.json
          cat module.json

      - name: Build zip
        run: |
          zip -r module.zip module.json scripts templates styles languages macros README.md LICENSE CHANGELOG.md
          sha256sum module.json module.zip | tee SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" module.json module.zip SHA256SUMS.txt --title "$TAG" --generate-notes --verify-tag
